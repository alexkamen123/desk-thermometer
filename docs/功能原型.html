<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小熊温度牌 · 功能原型</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f2ea;color:#243b2c;font:17px/1.6 system-ui,sans-serif}main{max-width:1020px;margin:36px auto;padding:0 20px}h1{font-size:clamp(28px,5vw,44px);margin:0}p{color:#566358}.controls{display:flex;gap:20px;flex-wrap:wrap;background:white;padding:20px;border-radius:16px;margin:24px 0}label{flex:1;min-width:220px}select{display:block;width:100%;font:inherit;padding:10px;border:1px solid #bcc8bc;border-radius:8px;background:white}.screen{position:relative;max-width:800px;border:8px solid #273a30;border-radius:14px;overflow:hidden;background:white}.screen img{width:100%;display:block}.top{position:absolute;top:0;left:0;width:100%;height:11%;display:flex;align-items:center;justify-content:space-between;background:white;color:black;padding:0 3%;font:clamp(9px,1.7vw,16px)/1 monospace}#state{padding:16px 20px;background:#e0eada;border-radius:12px}small{color:#637267}a{color:#285a43}footer{margin:28px 0}</style>
<main><small>v1.5.2 · 当前实现的交互演示</small><h1>温度决定说不说，星期决定用哪张图。</h1><p>选择星期和示例温度，观察请求区域的变化。这里不连接设备，不执行配网。</p>
<div class="controls"><label>星期<select id="day"><option value="1">周一</option><option value="2">周二</option><option value="3">周三</option><option value="4">周四</option><option value="5">周五</option><option value="6">周六</option><option value="0">周日</option><option value="invalid">时间无效</option></select></label><label>实测室温示例<select id="temperature"><option value="25.4">25.4℃ · 隐藏请求</option><option value="25.5" selected>25.5℃ · 显示请求</option><option value="32.5">32.5℃ · 显示请求</option></select></label></div>
<div class="screen"><img id="screen" alt="温度牌画面"><div class="top"><span id="time"></span><span id="weekday"></span><span>RH47%</span></div></div><p id="state" aria-live="polite"></p>
<footer><small>画面来自实际C++绘图代码的主机渲染，不是实机照片。日期为演示值。25.49℃舍入显示25.5℃时，请求仍按原始值隐藏。</small><p><a href="功能原型与状态机.md">完整功能和状态机</a> · <a href="玩法路线图.md">还可以怎么玩</a></p></footer></main>
<script>const day=document.querySelector('#day'),temp=document.querySelector('#temperature');function update(){let invalid=day.value==='invalid',d=Number(day.value),cover=invalid?1:(d===0||d===6?5:d);let request=Number(temp.value)>=25.5;document.querySelector('#screen').src=`images/day-${cover}-${temp.value}.png`;document.querySelector('#time').textContent=invalid?'TIME UNSET':'11-'+(d===0?22:15+d)+' 09:00';document.querySelector('#weekday').textContent=invalid?'':['周日','周一','周二','周三','周四','周五','周六'][d];document.querySelector('#state').textContent=(request?'请求显示：星期标题＋“空调先别调到26℃嘛”。':'请求隐藏：标题与副句全部置空，保留小熊和实时数据。')+(invalid?' 时间无效，回退周一形象。':d===0||d===6?' 周末沿用周五形象。':'');}day.onchange=temp.onchange=update;update();</script></html>
